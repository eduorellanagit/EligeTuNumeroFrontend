<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:image" content="https://eligetunumero.com/assets/logo/icon.png" />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" type="image/png" href="assets/logo/icon.png">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/buttons.css" />

  <link rel="stylesheet" href="css/promo.css" />
  <link rel="stylesheet" href="css/simple-footer.css" />
</head>
<body>

  <div class="auth-page">
    <header class="auth-topbar">
      <a href="index.html" class="auth-topbar__logo">EligeTuNumero</a>
      <button class="back-button" onclick="history.back()"><span data-icon="arrow-left"></span> Volver</button>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <h1>Ingresá a tu cuenta</h1>
        <p class="auth-card__subtitle">
          Sin contraseñas — tu cuenta se crea sola la primera vez.
        </p>

        <div class="promo-banner" data-promo>🎁 <strong>Cuentas nuevas:</strong> 1 crédito gratis</div>

        <div class="auth-providers">
          <button class="auth-provider-btn auth-provider-btn--google" data-provider="Google">
            <svg class="auth-provider-btn__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.66-.22-2.45H12v4.63h6.48c-.28 1.5-1.14 2.78-2.42 3.63v3h3.91c2.29-2.11 3.55-5.19 3.55-8.81z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.95-2.92l-3.91-3c-1.08.73-2.47 1.16-4.04 1.16-3.1 0-5.73-2.09-6.67-4.9H1.29v3.09C3.27 21.3 7.31 24 12 24z"/>
              <path fill="#FBBC05" d="M5.33 14.34A7.2 7.2 0 0 1 4.95 12c0-.81.14-1.6.38-2.34V6.57H1.29A11.98 11.98 0 0 0 0 12c0 1.94.46 3.77 1.29 5.43l4.04-3.09z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.45-3.45C17.95 1.19 15.24 0 12 0 7.31 0 3.27 2.7 1.29 6.57l4.04 3.09c.94-2.81 3.57-4.91 6.67-4.91z"/>
            </svg>
            Continuar con Google
          </button>
        </div>

        <p class="auth-loading" id="auth-loading"></p>

        <p class="auth-note">
          Al continuar, aceptás nuestros <a href="terminos-y-condiciones.html" style="color: var(--color-primary); font-weight:700;">Términos y condiciones</a>.
        </p>
      </div>
    </main>

    <footer class="simple-footer">
      <div class="simple-footer__inner">
        <span class="simple-footer__logo">EligeTuNumero</span>
        <div class="simple-footer__links">
          <a href="index.html">Inicio</a>
          <a href="terminos-y-condiciones.html">Términos y condiciones</a>
          <a href="privacidad.html">Privacidad de uso</a>
          <a href="cookies.html">Política de cookies</a>
        </div>
        <span class="simple-footer__copy" id="auth-footer-year">© 2026 EligeTuNumero</span>
      </div>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth/session.js"></script>
  <script src="js/common/promo.js"></script>
  <script src="js/common/icons.js"></script>
  <script src="js/common/render-icons.js"></script>
  <script src="js/auth/login.js"></script>
  <script>
    document.getElementById('auth-footer-year').textContent = '© ' + new Date().getFullYear() + ' EligeTuNumero'
  </script>
</body>
</html>
