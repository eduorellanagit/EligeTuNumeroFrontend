<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rifa — Rifalo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/public-raffle.css" />
  <link rel="stylesheet" href="css/number-grid.css" />
  <link rel="stylesheet" href="css/purchase-modal.css" />
  <link rel="stylesheet" href="css/confirmation.css" />
  <link rel="stylesheet" href="css/simple-footer.css" />
</head>
<body>

  <div class="raffle-page">
    <header class="raffle-topbar">
      <a href="index.html" class="raffle-topbar__logo">Rifalo</a>
      <button class="back-button" onclick="history.back()"><span data-icon="arrow-left"></span> Volver</button>
    </header>

    <main class="raffle-content">
      <div class="raffle-header" id="raffle-header"></div>

      <section class="raffle-section">
        <h2 class="raffle-section__title">Premios en juego</h2>
        <div class="prize-gallery" id="prize-gallery"></div>
      </section>

      <section class="raffle-section">
        <div class="grid-header">
          <h2 class="raffle-section__title">Elegí tus números</h2>
          <span class="grid-header__price" id="price-per-number"></span>
        </div>

        <div class="grid-legend">
          <span><i class="dot-available"></i> Disponible</span>
          <span><i class="dot-reserved"></i> Reservado / en revisión</span>
          <span><i class="dot-paid"></i> Pagado</span>
          <span><i style="background: var(--color-primary)"></i> Elegido por vos</span>
        </div>

        <div class="number-grid" id="number-grid"></div>
      </section>
    </main>

    <footer class="simple-footer">
      <div class="simple-footer__inner">
        <span class="simple-footer__logo">Rifalo</span>
        <div class="simple-footer__links">
          <a href="index.html">Inicio</a>
          <a href="terminos.html">Términos y condiciones</a>
        </div>
        <span class="simple-footer__copy" id="raffle-footer-year">© 2026 Rifalo</span>
      </div>
    </footer>
  </div>

  <!-- Barra flotante: aparece cuando hay al menos un número elegido -->
  <div class="float-bar" id="float-bar">
    <div id="float-bar-text"></div>
    <button class="btn btn-primary" id="float-bar-btn">Reservar</button>
  </div>

  <!-- Modal genérico, usado por el flujo de reserva -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close-btn" aria-label="Cerrar"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="js/data/mock-data.js"></script>
  <script src="js/common/icons.js"></script>
  <script src="js/common/render-icons.js"></script>
  <script src="js/common/modal.js"></script>
  <script src="js/raffle/number-grid.js"></script>
  <script src="js/common/scroll-reveal.js"></script>
  <script src="js/raffle/purchase-modal.js"></script>
  <script>
    document.getElementById('raffle-footer-year').textContent = '© ' + new Date().getFullYear() + ' Rifalo'
  </script>
</body>
</html>
